name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node tool/sw_test.js
      # Le service worker de Flutter reste désactivé : il servait sa propre
      # copie du site sans jamais l'invalider. web/sw.js le remplace.
      - run: flutter build web --release --base-href /kana-quiz/ --pwa-strategy=none

      # Le cache du service worker porte le numéro du commit : un déploiement
      # ouvre un cache neuf et supprime les précédents.
      - run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/" build/web/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
